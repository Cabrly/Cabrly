<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0614"/>
      <stop offset="1" stop-color="#1a0726"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2a6d" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff2a6d" stop-opacity=".55"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity=".28"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="slice">
      <rect x="0" y="120" width="1200" height="14">
        <animate attributeName="y" values="120;170;95;150;120" keyTimes="0;.25;.5;.75;1" dur="2.6s" calcMode="discrete" repeatCount="indefinite"/>
        <animate attributeName="height" values="14;6;22;9;14" keyTimes="0;.25;.5;.75;1" dur="2.6s" calcMode="discrete" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      .title { font: 900 104px 'Arial Black', Impact, 'Helvetica Neue', sans-serif; letter-spacing: 6px; }
      .mono  { font: 700 18px 'Courier New', Consolas, monospace; letter-spacing: 3px; }
      .tiny  { font: 700 12px 'Courier New', Consolas, monospace; letter-spacing: 2px; }
      .jp    { font: 700 22px 'Yu Gothic', 'Hiragino Sans', 'Noto Sans JP', sans-serif; letter-spacing: 8px; }
      .c { animation: jitC 2.6s steps(1) infinite; }
      .m { animation: jitM 2.6s steps(1) infinite; }
      .s { animation: jitS 2.6s steps(1) infinite; }
      .blink { animation: blink 1s steps(1) infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes jitC { 0%{transform:translate(4px,0)} 8%{transform:translate(-6px,2px)} 10%{transform:translate(4px,0)} 52%{transform:translate(9px,-2px)} 55%{transform:translate(4px,0)} }
      @keyframes jitM { 0%{transform:translate(-4px,0)} 8%{transform:translate(6px,-2px)} 10%{transform:translate(-4px,0)} 52%{transform:translate(-9px,2px)} 55%{transform:translate(-4px,0)} }
      @keyframes jitS { 0%{transform:translate(0,0)} 25%{transform:translate(-22px,0)} 50%{transform:translate(16px,0)} 75%{transform:translate(-8px,0)} }
      @keyframes blink { 0%{opacity:1} 50%{opacity:0} }
      @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:.9} }
    </style>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- perspective grid floor -->
  <g stroke="#ff2a6d" stroke-width="1" opacity=".45">
    <path d="M0 250H1200M0 268H1200M0 292H1200M0 322H1200"/>
    <path d="M600 230L600 340M600 230L420 340M600 230L240 340M600 230L60 340M600 230L-120 340M600 230L780 340M600 230L960 340M600 230L1140 340M600 230L1320 340"/>
  </g>
  <rect y="230" width="1200" height="110" fill="url(#floor)" opacity=".35"/>

  <!-- skyline -->
  <g fill="#07030d"><rect x="0" y="190" width="40" height="60"/><rect x="40" y="160" width="30" height="90"/><rect x="95" y="130" width="45" height="120"/><rect x="160" y="170" width="35" height="80"/><rect x="225" y="110" width="20" height="140"/><rect x="245" y="130" width="15" height="120"/><rect x="290" y="180" width="40" height="70"/><rect x="355" y="150" width="50" height="100"/><rect x="425" y="195" width="30" height="55"/><rect x="485" y="150" width="45" height="100"/><rect x="565" y="120" width="20" height="130"/><rect x="585" y="95" width="10" height="155"/><rect x="625" y="185" width="40" height="65"/><rect x="690" y="210" width="30" height="40"/><rect x="750" y="140" width="45" height="110"/><rect x="820" y="180" width="30" height="70"/><rect x="885" y="140" width="40" height="110"/><rect x="950" y="200" width="35" height="50"/><rect x="1015" y="170" width="40" height="80"/><rect x="1100" y="200" width="40" height="50"/><rect x="1160" y="215" width="40" height="35"/></g>
  <g fill="#fcee0a" opacity=".7" class="pulse">
    <rect x="150" y="150" width="4" height="4"/><rect x="290" y="170" width="4" height="4"/>
    <rect x="470" y="180" width="4" height="4"/><rect x="565" y="140" width="4" height="4"/>
    <rect x="760" y="160" width="4" height="4"/><rect x="905" y="190" width="4" height="4"/>
    <rect x="1010" y="175" width="4" height="4"/>
  </g>

  <!-- yellow HUD frame (Edgerunners-style angled panels) -->
  <path d="M0 0H420L395 26H0Z" fill="#fcee0a"/>
  <text x="18" y="18" class="tiny" fill="#0b0614">ID://CABRLY  ·  STATUS: ONLINE</text>
  <path d="M1200 0H860L885 26H1200Z" fill="#ff2a6d"/>
  <text x="1182" y="18" class="tiny" fill="#0b0614" text-anchor="end">PALMAS—TO  ·  BR  ·  UTC-3</text>
  <path d="M40 60V44H80M1160 60V44H1120M40 214v16H80M1160 214v16h-40" stroke="#00f0ff" stroke-width="3" fill="none"/>

  <text x="600" y="78" class="jp" fill="#ff2a6d" text-anchor="middle" opacity=".85">サイバーパンク・エッジランナーズ</text>

  <!-- glitch title -->
  <g text-anchor="middle">
    <text x="600" y="178" class="title c" fill="#00f0ff" opacity=".85">VITOR CABRAL</text>
    <text x="600" y="178" class="title m" fill="#ff2a6d" opacity=".85">VITOR CABRAL</text>
    <text x="600" y="178" class="title" fill="#fcee0a" filter="url(#glow)">VITOR CABRAL</text>
    <g clip-path="url(#slice)">
      <text x="600" y="178" class="title s" fill="#f5f5f5">VITOR CABRAL</text>
    </g>
  </g>

  <text x="600" y="214" class="mono" fill="#00f0ff" text-anchor="middle">&gt; DEV FULLSTACK // JAVASCRIPT · PYTHON · IA<tspan class="blink" fill="#fcee0a">_</tspan></text>

  <rect width="1200" height="340" fill="url(#scan)"/>
  <rect x="0" y="336" width="1200" height="4" fill="#fcee0a"/>
</svg>
